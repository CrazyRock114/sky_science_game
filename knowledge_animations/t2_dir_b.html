<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Topic 2 · Direction B: 3Blue1Brown (Cardiac Cycle & Valve Dynamics)</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #000000; overflow: hidden; font-family: 'CMU-rm', 'NotoSansSC-500', serif; }
    #wrapper { position: relative; width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
    canvas { display: block; max-width: 100%; max-height: 100%; aspect-ratio: 16/9; box-shadow: 0 16px 60px rgba(0,0,0,0.95); }
    #ui {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(18, 18, 18, 0.95); border: 1px solid rgba(88, 196, 221, 0.45);
      padding: 10px 24px; border-radius: 40px; display: flex; align-items: center; gap: 16px;
      color: #eeeeee; box-shadow: 0 8px 32px rgba(0,0,0,0.8); z-index: 100; backdrop-filter: blur(12px);
    }
    body.render #ui { display: none; }
    button {
      background: #58c4dd; border: none; color: #000000; font-weight: 700; padding: 6px 18px;
      border-radius: 20px; cursor: pointer; transition: all 0.2s; font-family: sans-serif;
    }
    button:hover { background: #ffff00; transform: scale(1.05); }
    input[type=range] { width: 520px; accent-color: #ffff00; cursor: pointer; }
    #timer { font-family: monospace; font-size: 14px; min-width: 90px; text-align: center; color: #58c4dd; }
    .badge {
      background: rgba(255, 255, 0, 0.15); border: 1px solid #ffff00; color: #ffff00;
      font-size: 12px; padding: 2px 10px; border-radius: 12px; text-transform: uppercase; font-family: sans-serif;
    }
  </style>
</head>
<body>
<div id="wrapper">
  <canvas id="c" width="1920" height="1080"></canvas>
</div>

<div id="ui">
  <span class="badge">3Blue1Brown Logic</span>
  <button id="playBtn">Play / Pause</button>
  <input id="scrub" type="range" min="0" max="28.78" step="0.0166" value="0">
  <span id="timer">00:00.00</span>
</div>

<audio id="audio" src="audio/t2_cardiac_ryan.wav" preload="auto"></audio>

<script src="lib/fonts.js"></script>
<script src="lib/util.js"></script>
<script src="lib/motion.js"></script>
<script src="lib/camera.js"></script>
<script src="lib/diagram.js"></script>
<script src="lib/typo.js"></script>
<script src="lib/chart.js"></script>
<script src="lib/paint.js"></script>
<script src="lib/kit.js"></script>

<script>
(() => {
  const W = 1920, H = 1080;
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  window.__canvas = canvas;
  window.__total = 28.78;

  const audio = document.getElementById('audio');
  const scrub = document.getElementById('scrub');
  const timer = document.getElementById('timer');
  const playBtn = document.getElementById('playBtn');

  // 3b1b Manim Color Palette
  const BLUE_C  = '#58C4DD';
  const YELLOW  = '#FFFF00';
  const RED_C   = '#FC6255';
  const GREEN_C = '#83C167';
  const GREY_A  = '#DDDDDD';
  const GREY_C  = '#888888';
  const GREY_E  = '#222222';

  // Subtitles / Cues aligned with Ryan's audio
  const CUES = [
    {
      t0: 0.0, t1: 7.2,
      text: "During ventricular diastole, blood flows from the atria into the ventricles through open atrioventricular valves.",
      phase: "VENTRICULAR DIASTOLE · ΔP < 0 ⟹ AV VALVES OPEN",
      sub: "P_ventricle < P_atrium ⟹ AV Leaflets Hinge Downward · Forward Filling Flux v > 0"
    },
    {
      t0: 7.2, t1: 15.8,
      text: "As the ventricles contract in systole, ventricular pressure surges, snapping the AV valves shut to completely prevent backflow into the atria.",
      phase: "VENTRICULAR SYSTOLE · FIRST HEART SOUND (LUB)",
      sub: "Isovolumetric Contraction: P_v Surges > P_a ⟹ AV Valves LOCK SHUT (S1 / Lub) · v_reverse = 0"
    },
    {
      t0: 15.8, t1: 22.8,
      text: "This rising pressure forces the semilunar valves open, ejecting blood into the aorta and pulmonary artery.",
      phase: "VENTRICULAR EJECTION · HIGH-PRESSURE ARTERIAL FLUX",
      sub: "P_v > P_aorta (80 mmHg) ⟹ Semilunar Valves Burst Open · High-Velocity Arterial Ejection"
    },
    {
      t0: 22.8, t1: 28.78,
      text: "These one-way valves ensure smooth, unidirectional circulation throughout the body.",
      phase: "UNIDIRECTIONAL THEOREM · VALVE COMPETENCE",
      sub: "Semilunar Valves Snap Shut (S2 / Dub) ⟹ Zero Regurgitation · 100% Forward Vector Flux"
    }
  ];

  async function initFonts() {
    if (window.FONT_FACES) {
      for (const f of window.FONT_FACES) {
        try {
          const ff = new FontFace(f.family, `url(${f.url})`, f.desc || {});
          await ff.load();
          document.fonts.add(ff);
        } catch (e) {}
      }
    }
    await document.fonts.ready;
    window.__ready = true;
    renderFrame(0);
  }

  function drawVector(c, x0, y0, x1, y1, color = GREEN_C, lw = 3, headSize = 14) {
    const dx = x1 - x0, dy = y1 - y0;
    const len = Math.hypot(dx, dy);
    if (len < 2) return;
    const ux = dx / len, uy = dy / len;
    c.save();
    c.strokeStyle = color;
    c.fillStyle = color;
    c.lineWidth = lw;
    c.lineCap = 'round';
    c.beginPath();
    c.moveTo(x0, y0);
    c.lineTo(x1 - ux * (headSize * 0.5), y1 - uy * (headSize * 0.5));
    c.stroke();

    const nx = -uy, ny = ux;
    c.beginPath();
    c.moveTo(x1, y1);
    c.lineTo(x1 - ux * headSize + nx * (headSize * 0.45), y1 - uy * headSize + ny * (headSize * 0.45));
    c.lineTo(x1 - ux * headSize - nx * (headSize * 0.45), y1 - uy * headSize - ny * (headSize * 0.45));
    c.closePath();
    c.fill();
    c.restore();
  }

  function renderFrame(t) {
    ctx.clearRect(0, 0, W, H);

    // 1. Pure 3b1b Deep Slate/Black Background
    ctx.fillStyle = '#0f0f0f';
    ctx.fillRect(0, 0, W, H);

    // 2. Coordinate Grid (120px unit)
    const UNIT = 120;
    ctx.save();
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
    ctx.lineWidth = 1;
    for (let x = 0; x <= W; x += UNIT) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    }
    for (let y = 0; y <= H; y += UNIT) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }
    ctx.restore();

    // Valve Dynamics & State Machine
    const isPhase1 = t < 7.2;
    const isPhase2 = t >= 7.2 && t < 15.8;
    const isPhase3 = t >= 15.8 && t < 22.8;
    const isPhase4 = t >= 22.8;

    // Ventricular Pressure P_v(t) in mmHg
    let pVent = 10;
    if (isPhase1) {
      pVent = 8 + 3 * Math.sin(t * 3);
    } else if (isPhase2) {
      pVent = 10 + 90 * MO.smooth(MO.at(t, 7.2, 2.5)); // surges to 100 mmHg!
    } else if (isPhase3) {
      pVent = 100 + 20 * Math.sin((t - 15.8) * 1.5); // sustained ejection ~120 mmHg
    } else {
      const cycleT = (t - 22.8) % 1.2;
      pVent = cycleT < 0.5 ? 10 + 110 * MO.smooth(cycleT / 0.45) : 120 - 110 * MO.smooth((cycleT - 0.5) / 0.7);
    }

    // AV Valve Open Progress (1 = Open downward, 0 = Snapped shut)
    let avAngle = 0;
    if (isPhase1) {
      avAngle = 1.0;
    } else if (isPhase2) {
      avAngle = 1.0 - MO.backOut(MO.at(t, 7.2, 0.8), 2.2);
    } else if (isPhase3) {
      avAngle = 0.0;
    } else {
      const cycleT = (t - 22.8) % 1.2;
      avAngle = cycleT > 0.6 ? 1.0 : 0.0;
    }
    avAngle = U.clamp(avAngle, 0, 1);

    // Semilunar Valve Open Progress
    let slAngle = 0;
    if (isPhase1 || isPhase2) {
      slAngle = 0.0;
    } else if (isPhase3) {
      slAngle = MO.smooth(MO.at(t, 15.8, 1.0));
    } else {
      const cycleT = (t - 22.8) % 1.2;
      slAngle = cycleT <= 0.6 ? 1.0 : 0.0;
    }
    slAngle = U.clamp(slAngle, 0, 1);

    // Top Math Header in Computer Modern
    ctx.save();
    ctx.textAlign = 'center';
    ctx.fillStyle = GREY_A;
    ctx.font = '34px "CMU-rm", serif';
    ctx.fillText("Hydraulic Valve Differential:   ΔP = P_ventricle - P_atrium", W / 2, 80);

    ctx.font = '26px "CMU-it", serif';
    if (isPhase1) {
      ctx.fillStyle = BLUE_C;
      ctx.fillText("Diastole:  ΔP < 0  ⟹  AV Valves OPEN", W / 2 - 250, 125);
      ctx.fillStyle = GREY_C; ctx.fillText("⟹", W / 2 + 30, 125);
      ctx.fillStyle = GREEN_C; ctx.fillText("Forward Filling Vector  v > 0", W / 2 + 270, 125);
    } else if (isPhase2) {
      ctx.fillStyle = RED_C;
      ctx.fillText("Systole:  ΔP > 0  ⟹  AV Valves LOCK SHUT (Lub)", W / 2 - 250, 125);
      ctx.fillStyle = GREY_C; ctx.fillText("⟹", W / 2 + 70, 125);
      ctx.fillStyle = YELLOW; ctx.fillText("Zero Backflow:  v_reverse = 0", W / 2 + 290, 125);
    } else {
      ctx.fillStyle = YELLOW;
      ctx.fillText("Ejection:  P_ventricle > P_aorta  ⟹  Semilunar Valves OPEN", W / 2 - 250, 125);
      ctx.fillStyle = GREY_C; ctx.fillText("⟹", W / 2 + 100, 125);
      ctx.fillStyle = GREEN_C; ctx.fillText("Arterial Ejection Flux", W / 2 + 290, 125);
    }
    ctx.restore();

    // 3. Topological Geometric 4-Chamber Schematic (Left Stage: cx = 680)
    const cx = 680, cy = 520;
    const boxW = 210, boxH = 160;

    // Right Heart (Deox Blue)
    // RA (Top Left)
    ctx.save();
    ctx.strokeStyle = BLUE_C; ctx.lineWidth = 3;
    ctx.strokeRect(cx - boxW - 20, cy - boxH - 30, boxW, boxH);
    ctx.fillStyle = 'rgba(88, 196, 221, 0.12)';
    ctx.fillRect(cx - boxW - 20, cy - boxH - 30, boxW, boxH);
    ctx.fillStyle = BLUE_C;
    ctx.font = '24px "CMU-rm", serif'; ctx.textAlign = 'center';
    ctx.fillText("Right Atrium (RA)", cx - boxW / 2 - 20, cy - boxH / 2 - 30);
    ctx.font = '18px "CMU-it", serif';
    ctx.fillText("P_atrium ≈ 5 mmHg", cx - boxW / 2 - 20, cy - boxH / 2);
    ctx.restore();

    // RV (Bottom Left)
    ctx.save();
    ctx.strokeStyle = BLUE_C; ctx.lineWidth = 4;
    ctx.strokeRect(cx - boxW - 20, cy + 30, boxW, boxH + 60);
    ctx.fillStyle = 'rgba(88, 196, 221, 0.18)';
    ctx.fillRect(cx - boxW - 20, cy + 30, boxW, boxH + 60);
    ctx.fillStyle = BLUE_C;
    ctx.font = '24px "CMU-rm", serif'; ctx.textAlign = 'center';
    ctx.fillText("Right Ventricle (RV)", cx - boxW / 2 - 20, cy + boxH / 2 + 40);
    ctx.font = '18px "CMU-it", serif';
    ctx.fillText(`P_RV = ${Math.round(pVent * 0.4)} mmHg`, cx - boxW / 2 - 20, cy + boxH / 2 + 70);
    ctx.restore();

    // Left Heart (Oxy Red)
    // LA (Top Right)
    ctx.save();
    ctx.strokeStyle = RED_C; ctx.lineWidth = 3;
    ctx.strokeRect(cx + 20, cy - boxH - 30, boxW, boxH);
    ctx.fillStyle = 'rgba(252, 98, 85, 0.12)';
    ctx.fillRect(cx + 20, cy - boxH - 30, boxW, boxH);
    ctx.fillStyle = RED_C;
    ctx.font = '24px "CMU-rm", serif'; ctx.textAlign = 'center';
    ctx.fillText("Left Atrium (LA)", cx + boxW / 2 + 20, cy - boxH / 2 - 30);
    ctx.font = '18px "CMU-it", serif';
    ctx.fillText("P_atrium ≈ 8 mmHg", cx + boxW / 2 + 20, cy - boxH / 2);
    ctx.restore();

    // LV (Bottom Right - Thick Wall)
    ctx.save();
    ctx.strokeStyle = RED_C; ctx.lineWidth = 6;
    ctx.strokeRect(cx + 20, cy + 30, boxW, boxH + 60);
    ctx.fillStyle = 'rgba(252, 98, 85, 0.22)';
    ctx.fillRect(cx + 20, cy + 30, boxW, boxH + 60);
    ctx.fillStyle = RED_C;
    ctx.font = '24px "CMU-rm", serif'; ctx.textAlign = 'center';
    ctx.fillText("Left Ventricle (LV)", cx + boxW / 2 + 20, cy + boxH / 2 + 40);
    ctx.font = '18px "CMU-it", serif';
    ctx.fillText(`P_LV = ${Math.round(pVent)} mmHg`, cx + boxW / 2 + 20, cy + boxH / 2 + 70);
    ctx.restore();

    // Central Septum Divider
    ctx.save();
    ctx.strokeStyle = GREY_A; ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(cx, cy - boxH - 40); ctx.lineTo(cx, cy + boxH + 100);
    ctx.stroke();
    ctx.restore();

    // AV Valve Kinematic Leaflets (Tricuspid & Bicuspid)
    const valveY = cy;
    ctx.save();
    ctx.lineWidth = 5; ctx.lineCap = 'round';

    // Right AV (Tricuspid)
    ctx.strokeStyle = YELLOW;
    const rvx = cx - boxW / 2 - 20;
    ctx.beginPath();
    ctx.moveTo(rvx - 45, valveY); ctx.lineTo(rvx - 45 + Math.cos(avAngle * 0.9) * 45, valveY + Math.sin(avAngle * 0.9) * 45);
    ctx.moveTo(rvx + 45, valveY); ctx.lineTo(rvx + 45 - Math.cos(avAngle * 0.9) * 45, valveY + Math.sin(avAngle * 0.9) * 45);
    ctx.stroke();

    // Left AV (Bicuspid / Mitral)
    const lvx = cx + boxW / 2 + 20;
    ctx.beginPath();
    ctx.moveTo(lvx - 45, valveY); ctx.lineTo(lvx - 45 + Math.cos(avAngle * 0.9) * 45, valveY + Math.sin(avAngle * 0.9) * 45);
    ctx.moveTo(lvx + 45, valveY); ctx.lineTo(lvx + 45 - Math.cos(avAngle * 0.9) * 45, valveY + Math.sin(avAngle * 0.9) * 45);
    ctx.stroke();
    ctx.restore();

    // Flow Velocity Vectors
    if (avAngle > 0.3) {
      // Forward diastolic filling flux
      drawVector(ctx, rvx, valveY - 40, rvx, valveY + 70, GREEN_C, 3.5, 12);
      drawVector(ctx, lvx, valveY - 40, lvx, valveY + 70, GREEN_C, 3.5, 12);
    } else {
      // Stopped reverse vectors with red X (Zero Regurgitation)
      ctx.save();
      ctx.fillStyle = RED_C; ctx.font = 'bold 22px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText("✕ Backflow Blocked", rvx, valveY + 15);
      ctx.fillText("✕ Backflow Blocked", lvx, valveY + 15);
      ctx.restore();
    }

    // 4. Complete Wiggers Diagram with Real-Time Scanning Cursor (Right Stage: wx0 = 1260)
    const wx0 = 1260, wy0 = 260, wW = 540, wH = 420;
    ctx.save();
    // Coordinate Axes
    drawVector(ctx, wx0, wy0 + wH, wx0, wy0 - 30, GREY_A, 2.5, 12);
    drawVector(ctx, wx0, wy0 + wH, wx0 + wW + 40, wy0 + wH, GREY_A, 2.5, 12);

    // Axis Labels
    ctx.fillStyle = YELLOW;
    ctx.font = '22px "CMU-it", serif'; ctx.textAlign = 'center';
    ctx.fillText("Pressure (mmHg)", wx0, wy0 - 45);

    ctx.fillStyle = GREY_A;
    ctx.fillText("Time (Cardiac Phases)", wx0 + wW - 40, wy0 + wH + 45);

    // Y-Axis Ticks (0, 40, 80, 120 mmHg)
    [0, 40, 80, 120].forEach(val => {
      const ty = wy0 + wH - (val / 140) * wH;
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
      ctx.beginPath(); ctx.moveTo(wx0 - 8, ty); ctx.lineTo(wx0 + wW, ty); ctx.stroke();
      ctx.fillStyle = GREY_C; ctx.font = '16px "CMU-rm", serif'; ctx.textAlign = 'right';
      ctx.fillText(`${val}`, wx0 - 12, ty + 5);
    });

    // Wiggers Curves Plot:
    // 1. Aortic Pressure (Amber curve)
    ctx.strokeStyle = '#f59e0b'; ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(wx0, wy0 + wH - (80 / 140) * wH);
    ctx.lineTo(wx0 + wW * 0.28, wy0 + wH - (76 / 140) * wH);
    ctx.quadraticCurveTo(wx0 + wW * 0.45, wy0 + wH - (124 / 140) * wH, wx0 + wW * 0.65, wy0 + wH - (105 / 140) * wH);
    ctx.lineTo(wx0 + wW * 0.70, wy0 + wH - (110 / 140) * wH); // Dicrotic notch
    ctx.lineTo(wx0 + wW, wy0 + wH - (80 / 140) * wH);
    ctx.stroke();

    // 2. Left Ventricle Pressure (Red curve)
    ctx.strokeStyle = RED_C; ctx.lineWidth = 3.5;
    ctx.beginPath();
    ctx.moveTo(wx0, wy0 + wH - (10 / 140) * wH);
    ctx.lineTo(wx0 + wW * 0.22, wy0 + wH - (12 / 140) * wH);
    // Surge during systole
    ctx.lineTo(wx0 + wW * 0.32, wy0 + wH - (80 / 140) * wH); // Crosses aortic
    ctx.quadraticCurveTo(wx0 + wW * 0.45, wy0 + wH - (128 / 140) * wH, wx0 + wW * 0.68, wy0 + wH - (80 / 140) * wH);
    ctx.lineTo(wx0 + wW * 0.75, wy0 + wH - (10 / 140) * wH);
    ctx.lineTo(wx0 + wW, wy0 + wH - (10 / 140) * wH);
    ctx.stroke();

    // 3. Left Atrial Pressure (Blue curve)
    ctx.strokeStyle = BLUE_C; ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(wx0, wy0 + wH - (8 / 140) * wH);
    ctx.quadraticCurveTo(wx0 + wW * 0.15, wy0 + wH - (16 / 140) * wH, wx0 + wW * 0.22, wy0 + wH - (10 / 140) * wH);
    ctx.quadraticCurveTo(wx0 + wW * 0.65, wy0 + wH - (14 / 140) * wH, wx0 + wW, wy0 + wH - (8 / 140) * wH);
    ctx.stroke();

    // Critical Valve Events Annotations
    // S1 Mitral Shut: x = wx0 + wW * 0.22
    ctx.fillStyle = YELLOW; ctx.font = '16px "CMU-rm", serif'; ctx.textAlign = 'center';
    ctx.fillText("Mitral Shuts (Lub)", wx0 + wW * 0.22, wy0 + wH + 25);

    // S2 Aortic Shut: x = wx0 + wW * 0.70
    ctx.fillStyle = BLUE_C;
    ctx.fillText("Aortic Shuts (Dub)", wx0 + wW * 0.70, wy0 + wH + 25);

    // Legend
    ctx.textAlign = 'left'; ctx.font = '16px "CMU-rm", serif';
    ctx.fillStyle = RED_C; ctx.fillText("— Ventricular Pressure", wx0 + wW - 190, wy0 + 15);
    ctx.fillStyle = '#f59e0b'; ctx.fillText("— Aortic Pressure", wx0 + wW - 190, wy0 + 38);
    ctx.fillStyle = BLUE_C; ctx.fillText("— Atrial Pressure", wx0 + wW - 190, wy0 + 61);

    // Real-Time Scanning Cursor Line across Wiggers Diagram!
    const cycleScan = (t / 28.78);
    const cursorX = wx0 + cycleScan * wW;
    ctx.strokeStyle = '#ffff00';
    ctx.lineWidth = 2;
    ctx.shadowBlur = 12; ctx.shadowColor = '#ffff00';
    ctx.beginPath();
    ctx.moveTo(cursorX, wy0 - 15); ctx.lineTo(cursorX, wy0 + wH);
    ctx.stroke();
    ctx.restore();

    // 5. 3Blue1Brown Subtitle & Rigorous Logic Banner (Bottom Center)
    const activeCue = CUES.find(c => t >= c.t0 && t < c.t1) || CUES[CUES.length - 1];

    ctx.save();
    const subW = 1440;
    const subH = 120;
    const subX = (W - subW) / 2;
    const subY = 910;

    ctx.fillStyle = 'rgba(15, 15, 15, 0.95)';
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.roundRect(subX, subY, subW, subH, 16);
    ctx.fill();
    ctx.stroke();

    // Phase Indicator
    ctx.fillStyle = YELLOW;
    ctx.font = 'bold 15px sans-serif';
    ctx.fillText(`●  ${activeCue.phase}`, subX + 36, subY + 34);

    ctx.fillStyle = BLUE_C;
    ctx.font = '15px "CMU-rm", serif';
    ctx.fillText(`|   ${activeCue.sub}`, subX + 440, subY + 34);

    // Subtitle Text
    ctx.fillStyle = '#ffffff';
    ctx.font = '22px "CMU-rm", serif';
    ctx.fillText(activeCue.text, subX + 36, subY + 80);

    // Animated Logic Progress Bar
    const cueDur = activeCue.t1 - activeCue.t0;
    const cueProgress = U.clamp((t - activeCue.t0) / cueDur, 0, 1);
    ctx.fillStyle = YELLOW;
    ctx.fillRect(subX, subY + subH - 3, subW * cueProgress, 3);

    ctx.restore();
  }

  function updateUI(t) {
    scrub.value = t;
    const m = Math.floor(t / 60);
    const s = Math.floor(t % 60);
    const ms = Math.floor((t % 1) * 100);
    timer.textContent = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}.${String(ms).padStart(2, '0')}`;
  }

  let isPlaying = false;
  let animId = null;

  function loop() {
    if (!isPlaying) return;
    const cur = audio.currentTime;
    renderFrame(cur);
    updateUI(cur);
    if (cur >= window.__total) {
      pause();
      return;
    }
    animId = requestAnimationFrame(loop);
  }

  function play() {
    isPlaying = true;
    audio.play();
    animId = requestAnimationFrame(loop);
  }

  function pause() {
    isPlaying = false;
    audio.pause();
    if (animId) cancelAnimationFrame(animId);
  }

  playBtn.onclick = () => {
    if (isPlaying) pause();
    else play();
  };

  scrub.oninput = (e) => {
    const t = parseFloat(e.target.value);
    audio.currentTime = t;
    renderFrame(t);
    updateUI(t);
  };

  window.renderFrame = (t) => {
    renderFrame(t);
    updateUI(t);
  };

  initFonts();
})();
</script>
</body>
</html>
